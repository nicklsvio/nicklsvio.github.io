<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nickls.vio — Games</title>
<meta name="description" content="Nickls.vio — indie game developer. Monster Hunt for Android.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#1d1330; --card:#2a1c45; --text:#f4eefc; --muted:#c3b4dc; --accent:#8df07a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, #4a2a80 0%, var(--bg) 60%); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; padding:48px 16px; }
  h1 { font-size:2.2rem; margin:0 0 6px; letter-spacing:.5px; }
  .sub { color:var(--muted); margin:0 0 36px; }
  .card { background:var(--card); border-radius:24px; padding:28px; max-width:460px; width:100%; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  .card img { width:160px; height:160px; border-radius:36px; display:block; margin:0 auto 18px; }
  .card h2 { margin:0 0 10px; font-size:1.6rem; }
  .card p { color:var(--muted); line-height:1.5; margin:0 0 22px; }
  .btn { display:inline-block; background:var(--accent); color:#10301a; font-weight:800; text-decoration:none; padding:14px 30px; border-radius:999px; }
  .links { margin-top:20px; font-size:.95rem; }
  .links a { color:var(--muted); }
  footer { margin-top:40px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
  <h1>Nickls.vio</h1>
  <p class="sub">Indie game developer</p>
  <div class="card">
    <img src="icon.png" alt="Monster Hunt icon">
    <h2>Monster Hunt</h2>
    <p>Catch wild monsters with your net, tame them as friends, fuse them into a king and defeat giant bosses. Play solo or with friends over Wi-Fi.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.nicklsvio.monsterhunt">Get it on Google Play</a>
    <div class="links"><a href="https://doc-hosting.flycricket.io/monster-hunt-privacy-policy/053fe93f-dbfd-48b4-a244-857684368622/privacy">Privacy Policy</a></div>
  </div>
  <footer>© 2026 Nickls.vio</footer>
</body>
</html>
