<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Hunt — Google Play</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#6b3fb8;font-family:system-ui,sans-serif;color:#fff;text-align:center;padding:24px;box-sizing:border-box}
  img{width:128px;height:128px;border-radius:28px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  h1{font-size:26px;margin:18px 0 6px}
  p{margin:0 0 22px;opacity:.9}
  a.btn{display:inline-block;background:#01875f;color:#fff;text-decoration:none;font-size:20px;font-weight:600;
        padding:16px 34px;border-radius:14px}
  p.hint{margin:26px 0 0;font-size:14px;opacity:.75}
</style>
</head>
<body>
  <img src="icon.png" alt="Monster Hunt">
  <h1>Monster Hunt</h1>
  <p>Нажми кнопку, чтобы установить игру</p>
  <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.nicklsvio.monsterhunt">Открыть в Google Play</a>
  <p class="hint">Не открывается? Нажми ⋯ вверху → «Открыть в браузере»</p>
<script>
  var pkg = 'com.nicklsvio.monsterhunt';
  var web = 'https://play.google.com/store/apps/details?id=' + pkg;
  var btn = document.getElementById('play');
  if (/Android/i.test(navigator.userAgent)) {
    var intent = 'intent://details?id=' + pkg +
      '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' +
      encodeURIComponent(web) + ';end';
    btn.addEventListener('click', function(e){
      e.preventDefault();
      location.href = intent;
      setTimeout(function(){ if (!document.hidden) location.href = web; }, 1200);
    });
  } else {
    location.href = web;
  }
</script>
</body>
</html>
